<!DOCTYPE html>
<!--
  Sign-in code for the Initiation checkout dialog (signInWithOtp).
  Paste into Supabase Dashboard → Authentication → Email Templates for BOTH
  "Magic Link" (existing accounts) and "Confirm signup" (new accounts).
  Subject: Your Multiverse Collective sign-in code
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your sign-in code — Multiverse Collective</title>
</head>
<body style="margin:0;padding:0;background-color:#0A0E27;font-family:'Courier New',Courier,monospace;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#0A0E27;">
    <tr>
      <td align="center" style="padding:48px 16px;">
        <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;">
          <tr>
            <td align="center" style="padding-bottom:32px;">
              <span style="font-family:'Courier New',Courier,monospace;font-size:12px;font-weight:700;letter-spacing:0.3em;color:#FF6B35;text-transform:uppercase;">
                MULTIVERSE COLLECTIVE
              </span>
            </td>
          </tr>
          <tr>
            <td style="background-color:#0D1020;padding:40px 32px;">
              <h1 style="margin:0 0 16px 0;font-family:'Courier New',Courier,monospace;font-size:20px;font-weight:700;color:#F5F5F5;line-height:1.3;">
                Your sign-in code
              </h1>
              <p style="margin:0 0 24px 0;font-family:'Courier New',Courier,monospace;font-size:16px;color:#F5F5F5;line-height:1.5;">
                Enter this code on Multiverse Collective to continue to checkout.
              </p>
              <p style="margin:0 0 24px 0;font-family:'Courier New',Courier,monospace;font-size:32px;font-weight:700;letter-spacing:0.25em;color:#FF6B35;">
                {{ .Token }}
              </p>
              <p style="margin:0;font-family:'Courier New',Courier,monospace;font-size:12px;color:#8A93A8;line-height:1.5;">
                The code expires soon and works once. If you did not request it, you can ignore this email.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
