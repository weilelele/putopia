<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Unified Console · Mobile Concepts</title>
    <style>
      :root { color-scheme: dark; font-family: "Courier New", monospace; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #080c20; color: #f5f5f5; }
      header { padding: 24px 16px 18px; border-bottom: 1px solid rgba(245,245,245,.16); }
      h1 { margin: 0; color: #e35205; font-size: 20px; letter-spacing: .08em; }
      p { margin: 10px 0 0; color: rgba(245,245,245,.58); font-size: 13px; line-height: 1.6; }
      main { padding: 16px 12px 40px; }
      section { margin: 0 auto 28px; max-width: 430px; }
      h2 { margin: 0 0 10px; font-size: 14px; color: #e35205; letter-spacing: .1em; }
      a { display: block; color: inherit; text-decoration: none; }
      img { display: block; width: 100%; height: auto; border: 1px solid rgba(245,245,245,.22); background: #080c20; }
      .hint { margin-top: 8px; font-size: 12px; color: rgba(245,245,245,.45); }
    </style>
  </head>
  <body>
    <header>
      <h1>UNIFIED CONSOLE</h1>
      <p>线上与离线状态统一后的三种竖屏方向。点击图片可单独打开并放大。</p>
    </header>
    <main>
      <section>
        <h2>OPTION 1</h2>
        <a href="./option-1.png"><img src="./option-1.png" alt="统一 Console 方向一" /></a>
        <div class="hint">CANONICAL CONTINUITY</div>
      </section>
      <section>
        <h2>OPTION 2</h2>
        <a href="./option-2.png"><img src="./option-2.png" alt="统一 Console 方向二" loading="lazy" /></a>
        <div class="hint">QUIET SIGNAL RIBBON</div>
      </section>
      <section>
        <h2>OPTION 3</h2>
        <a href="./option-3.png"><img src="./option-3.png" alt="统一 Console 方向三" loading="lazy" /></a>
        <div class="hint">INTEGRATED CONNECTION STATE</div>
      </section>
    </main>
  </body>
</html>
