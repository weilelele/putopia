<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transition A — CRT Power Cycle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050810; font-family: 'Courier New', monospace; color: #F2F0E6; overflow: hidden; height: 100vh; }

  /* ── SCREEN WRAPPER — this is what gets squished ── */
  #screen {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    transform-origin: center center;
    transition: none;
  }

  /* ── BEFORE: CTA page ── */
  #before {
    text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 1.5rem;
  }
  .eyebrow { font-size: 0.55rem; letter-spacing: 0.4em; color: rgba(34,212,224,0.7); }
  .big { font-size: 2.2rem; letter-spacing: 0.12em; font-family: Georgia, serif; font-weight: 700; }
  .sub { font-size: 0.7rem; letter-spacing: 0.2em; color: rgba(242,240,230,0.45); }
  .btn {
    margin-top: 1rem;
    padding: 0.9rem 2.4rem;
    background: #FF5A1F; border: none;
    font-family: 'Courier New', monospace; font-size: 0.65rem; letter-spacing: 0.25em;
    color: #F2F0E6; cursor: pointer;
    transition: background 0.2s;
  }
  .btn:hover { background: #ff7040; }

  /* ── AFTER: Welcome page ── */
  #after {
    display: none; text-align: center;
    flex-direction: column; align-items: center; gap: 1rem;
  }
  .welcome-eye { font-size: 0.55rem; letter-spacing: 0.4em; color: rgba(34,212,224,0.7); }
  .welcome-big { font-size: 3rem; letter-spacing: 0.18em; color: #FF5A1F; font-family: Georgia, serif; }
  .welcome-sub { font-size: 0.65rem; letter-spacing: 0.22em; color: rgba(242,240,230,0.5); margin-top: 0.5rem; }

  /* ── PHOSPHOR LINE overlay ── */
  #phosphor {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none; z-index: 100;
    opacity: 0;
  }
  #phosphor-line {
    width: 100%; height: 3px;
    background: linear-gradient(90deg, transparent 0%, rgba(200,240,255,0.15) 10%, rgba(200,240,255,0.9) 50%, rgba(200,240,255,0.15) 90%, transparent 100%);
    box-shadow: 0 0 12px rgba(200,240,255,0.8), 0 0 40px rgba(200,240,255,0.3);
  }

  /* ── SCANLINE texture ── */
  #screen::before {
    content: '';
    position: absolute; inset: 0; z-index: 50; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent 0px, transparent 3px, rgba(0,0,0,0.07) 3px, rgba(0,0,0,0.07) 4px);
  }
</style>
</head>
<body>

<div id="screen">
  <div id="before">
    <div class="eyebrow">IDENTITY CONFIRMED</div>
    <div class="big">Yes, it's you.</div>
    <div class="sub">YOU ARE THE VOYAGER WE HAVE BEEN LOOKING FOR</div>
    <button class="btn" onclick="runTransition()">CONFIRM MY VOYAGER IDENTITY</button>
  </div>
  <div id="after">
    <div class="welcome-eye">WELCOME,</div>
    <div class="welcome-big">VOYAGER</div>
    <div class="welcome-sub">YOU HAVE BEEN SELECTED TO EXPLORE<br>THE MYSTERIES OF PARALLEL WORLDS.</div>
  </div>
</div>

<div id="phosphor"><div id="phosphor-line"></div></div>

<script>
function runTransition() {
  const screen    = document.getElementById('screen')
  const before    = document.getElementById('before')
  const after     = document.getElementById('after')
  const phosphor  = document.getElementById('phosphor')

  // ── Audio: CRT power-down whine ──
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)()
    const t = ctx.currentTime

    // Descending whine
    const osc = ctx.createOscillator()
    osc.type = 'sine'
    osc.frequency.setValueAtTime(8000, t)
    osc.frequency.exponentialRampToValueAtTime(200, t + 0.5)
    osc.frequency.exponentialRampToValueAtTime(60, t + 0.9)
    const g = ctx.createGain()
    g.gain.setValueAtTime(0.15, t)
    g.gain.linearRampToValueAtTime(0, t + 0.9)
    osc.connect(g); g.connect(ctx.destination)
    osc.start(); osc.stop(t + 1.0)

    // Power-up hum (delayed)
    setTimeout(() => {
      const t2 = ctx.currentTime
      const osc2 = ctx.createOscillator()
      osc2.type = 'sine'
      osc2.frequency.setValueAtTime(80, t2)
      osc2.frequency.exponentialRampToValueAtTime(6000, t2 + 0.4)
      const g2 = ctx.createGain()
      g2.gain.setValueAtTime(0, t2)
      g2.gain.linearRampToValueAtTime(0.12, t2 + 0.1)
      g2.gain.linearRampToValueAtTime(0, t2 + 0.5)
      osc2.connect(g2); g2.connect(ctx.destination)
      osc2.start(); osc2.stop(t2 + 0.6)
    }, 700)
  } catch(e) {}

  // ── Phase 1: Compress screen to horizontal line (400ms) ──
  screen.style.transition = 'transform 0.4s cubic-bezier(0.55, 0, 1, 0.45)'
  screen.style.transform  = 'scaleY(0.004)'

  setTimeout(() => {
    // ── Phase 2: Show phosphor glow line ──
    before.style.display  = 'none'
    after.style.display   = 'flex'
    after.style.opacity   = '0'
    phosphor.style.opacity = '1'
    phosphor.style.transition = 'opacity 0.12s'

    setTimeout(() => {
      // ── Phase 3: Expand back out (360ms) ──
      phosphor.style.transition = 'opacity 0.4s'
      phosphor.style.opacity    = '0'
      screen.style.transition   = 'transform 0.36s cubic-bezier(0, 0.55, 0.45, 1)'
      screen.style.transform    = 'scaleY(1)'

      setTimeout(() => {
        // ── Phase 4: Fade in content ──
        after.style.transition = 'opacity 0.5s ease'
        after.style.opacity    = '1'
      }, 200)
    }, 120)
  }, 420)
}
</script>
</body>
</html>
