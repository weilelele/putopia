<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transition B — Signal Scan Lock</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050810; font-family: 'Courier New', monospace; color: #F2F0E6; overflow: hidden; height: 100vh; }

  /* ── Pages ── */
  #before, #after {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 1.5rem; text-align: center;
  }
  #after { opacity: 0; pointer-events: none; }

  .eyebrow  { font-size: 0.55rem; letter-spacing: 0.4em; color: rgba(34,212,224,0.7); }
  .big      { font-size: 2.2rem; letter-spacing: 0.12em; font-family: Georgia, serif; }
  .sub      { font-size: 0.65rem; letter-spacing: 0.22em; color: rgba(242,240,230,0.45); }
  .btn {
    margin-top: 1rem; padding: 0.9rem 2.4rem;
    background: #FF5A1F; border: none;
    font-family: 'Courier New', monospace; font-size: 0.65rem; letter-spacing: 0.25em;
    color: #F2F0E6; cursor: pointer; transition: background 0.2s;
  }
  .btn:hover { background: #ff7040; }
  .welcome-big { font-size: 3rem; letter-spacing: 0.18em; color: #FF5A1F; font-family: Georgia, serif; }

  /* ── Scan beam ── */
  #scan-beam {
    position: fixed; left: 0; right: 0; top: -4px; height: 4px;
    z-index: 200; pointer-events: none; opacity: 0;
    background: linear-gradient(90deg,
      transparent 0%, rgba(34,212,224,0.2) 8%,
      rgba(34,212,224,1) 50%, rgba(34,212,224,0.2) 92%, transparent 100%);
    box-shadow: 0 0 18px rgba(34,212,224,0.9), 0 0 60px rgba(34,212,224,0.4), 0 8px 40px rgba(34,212,224,0.15);
    transition: top 0s linear, opacity 0.08s;
  }

  /* The beam reveals #after by using a clip that expands downward */
  #after { clip-path: inset(0 0 100% 0); transition: none; opacity: 1; pointer-events: none; }

  /* ── Scanlines ── */
  body::after {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 300;
    background: repeating-linear-gradient(0deg, transparent 0px, transparent 3px, rgba(0,0,0,0.07) 3px, rgba(0,0,0,0.07) 4px);
  }
</style>
</head>
<body>

<div id="before">
  <div class="eyebrow">IDENTITY CONFIRMED</div>
  <div class="big">Yes, it's you.</div>
  <div class="sub">YOU ARE THE VOYAGER WE HAVE BEEN LOOKING FOR</div>
  <button class="btn" onclick="runTransition()">CONFIRM MY VOYAGER IDENTITY</button>
</div>

<div id="after">
  <div class="eyebrow">WELCOME,</div>
  <div class="welcome-big">VOYAGER</div>
  <div class="sub">YOU HAVE BEEN SELECTED TO EXPLORE<br>THE MYSTERIES OF PARALLEL WORLDS.</div>
</div>

<div id="scan-beam"></div>

<script>
function runTransition() {
  const beam   = document.getElementById('scan-beam')
  const after  = document.getElementById('after')
  const before = document.getElementById('before')
  const H      = window.innerHeight

  // ── Audio: electronic scan ping ──
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)()

    // Soft rising tone as beam starts
    const t = ctx.currentTime
    const osc = ctx.createOscillator()
    osc.type = 'sine'
    osc.frequency.setValueAtTime(440, t)
    osc.frequency.linearRampToValueAtTime(880, t + 0.6)
    const g = ctx.createGain()
    g.gain.setValueAtTime(0, t)
    g.gain.linearRampToValueAtTime(0.08, t + 0.05)
    g.gain.setValueAtTime(0.08, t + 0.55)
    g.gain.linearRampToValueAtTime(0, t + 0.7)
    osc.connect(g); g.connect(ctx.destination)
    osc.start(); osc.stop(t + 0.8)

    // Completion chime
    setTimeout(() => {
      const t2 = ctx.currentTime
      const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = 1320
      const g2 = ctx.createGain()
      g2.gain.setValueAtTime(0.1, t2); g2.gain.exponentialRampToValueAtTime(0.001, t2 + 0.5)
      o2.connect(g2); g2.connect(ctx.destination); o2.start(); o2.stop(t2 + 0.5)
    }, 680)
  } catch(e) {}

  // ── Animate beam top-to-bottom ──
  const DURATION = 700 // ms for full sweep
  const startTime = performance.now()

  before.style.transition = 'opacity 0.25s'
  before.style.opacity = '0.35'  // dim but don't hide — beam "scans" over it

  beam.style.opacity = '1'
  beam.style.top = '-4px'

  function animateBeam(now) {
    const elapsed = now - startTime
    const progress = Math.min(elapsed / DURATION, 1)
    const y = progress * (H + 4)

    beam.style.top = y + 'px'

    // Reveal #after up to where the beam is
    const pct = (progress * 100).toFixed(2)
    after.style.clipPath = `inset(0 0 ${(100 - progress * 100).toFixed(2)}% 0)`

    if (progress < 1) {
      requestAnimationFrame(animateBeam)
    } else {
      // Done — hide beam, fade out before, fully show after
      beam.style.transition = 'opacity 0.2s'
      beam.style.opacity = '0'
      before.style.opacity = '0'
      after.style.clipPath = 'inset(0 0 0% 0)'
      after.style.transition = 'opacity 0.3s'
      after.style.opacity = '1'
      after.style.pointerEvents = 'auto'
    }
  }

  requestAnimationFrame(animateBeam)
}
</script>
</body>
</html>
