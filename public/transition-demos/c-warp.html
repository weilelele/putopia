<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transition C — Hyperspace Warp</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050810; font-family: 'Courier New', monospace; color: #F2F0E6; overflow: hidden; height: 100vh; }

  #before, #after {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 1.5rem; text-align: center;
    transition: opacity 0.4s ease;
  }
  #after { opacity: 0; pointer-events: none; }

  .eyebrow  { font-size: 0.55rem; letter-spacing: 0.4em; color: rgba(34,212,224,0.7); }
  .big      { font-size: 2.2rem; letter-spacing: 0.12em; font-family: Georgia, serif; }
  .sub      { font-size: 0.65rem; letter-spacing: 0.22em; color: rgba(242,240,230,0.45); }
  .btn {
    margin-top: 1rem; padding: 0.9rem 2.4rem;
    background: #FF5A1F; border: none;
    font-family: 'Courier New', monospace; font-size: 0.65rem; letter-spacing: 0.25em;
    color: #F2F0E6; cursor: pointer; transition: background 0.2s;
  }
  .btn:hover { background: #ff7040; }
  .welcome-big { font-size: 3rem; letter-spacing: 0.18em; color: #FF5A1F; font-family: Georgia, serif; }

  /* ── Warp canvas ── */
  #warp {
    position: fixed; inset: 0; z-index: 100;
    pointer-events: none; opacity: 0;
    transition: opacity 0.25s;
  }
</style>
</head>
<body>

<div id="before">
  <div class="eyebrow">IDENTITY CONFIRMED</div>
  <div class="big">Yes, it's you.</div>
  <div class="sub">YOU ARE THE VOYAGER WE HAVE BEEN LOOKING FOR</div>
  <button class="btn" onclick="runTransition()">CONFIRM MY VOYAGER IDENTITY</button>
</div>

<div id="after">
  <div class="eyebrow">WELCOME,</div>
  <div class="welcome-big">VOYAGER</div>
  <div class="sub">YOU HAVE BEEN SELECTED TO EXPLORE<br>THE MYSTERIES OF PARALLEL WORLDS.</div>
</div>

<canvas id="warp"></canvas>

<script>
function runTransition() {
  const before = document.getElementById('before')
  const after  = document.getElementById('after')
  const canvas = document.getElementById('warp')
  const ctx    = canvas.getContext('2d')

  canvas.width  = window.innerWidth
  canvas.height = window.innerHeight
  const W = canvas.width, H = canvas.height
  const cx = W / 2, cy = H / 2

  // ── Audio: deep space whoosh ──
  try {
    const ac  = new (window.AudioContext || window.webkitAudioContext)()
    const t   = ac.currentTime

    // Low rumble build
    const rumble = ac.createOscillator(); rumble.type = 'sine'; rumble.frequency.value = 55
    const rg = ac.createGain()
    rg.gain.setValueAtTime(0, t)
    rg.gain.linearRampToValueAtTime(0.18, t + 0.3)
    rg.gain.linearRampToValueAtTime(0.06, t + 1.0)
    rg.gain.linearRampToValueAtTime(0, t + 1.4)
    rumble.connect(rg); rg.connect(ac.destination); rumble.start(); rumble.stop(t + 1.5)

    // Swoosh noise
    const buf = ac.createBuffer(1, ac.sampleRate * 1.4, ac.sampleRate)
    const d = buf.getChannelData(0)
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1)
    const noise = ac.createBufferSource(); noise.buffer = buf
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 600
    const ng = ac.createGain()
    ng.gain.setValueAtTime(0, t)
    ng.gain.linearRampToValueAtTime(0.12, t + 0.2)
    ng.gain.linearRampToValueAtTime(0.22, t + 0.6)
    ng.gain.linearRampToValueAtTime(0, t + 1.3)
    noise.connect(lp); lp.connect(ng); ng.connect(ac.destination); noise.start()

    // High shimmer at peak
    setTimeout(() => {
      const t2 = ac.currentTime
      const hi = ac.createOscillator(); hi.type = 'sine'; hi.frequency.value = 3200
      const hg = ac.createGain()
      hg.gain.setValueAtTime(0.06, t2); hg.gain.exponentialRampToValueAtTime(0.001, t2 + 0.6)
      hi.connect(hg); hg.connect(ac.destination); hi.start(); hi.stop(t2 + 0.7)
    }, 500)
  } catch(e) {}

  // ── Stars ──
  const NUM_STARS = 320
  const stars = Array.from({ length: NUM_STARS }, () => ({
    angle: Math.random() * Math.PI * 2,
    r: Math.random() * 8 + 2,          // starting radius from center
    speed: Math.random() * 0.6 + 0.4,  // multiplier
    length: 0,
    // Color: mostly white, occasional cyan/orange
    hue: Math.random() > 0.9 ? (Math.random() > 0.5 ? 'cyan' : 'orange') : 'white',
    opacity: Math.random() * 0.5 + 0.5,
  }))

  const startMs   = performance.now()
  const ACCEL_MS  = 900   // acceleration phase
  const HOLD_MS   = 200   // pure black hold
  const TOTAL_MS  = ACCEL_MS + HOLD_MS
  let rafId

  canvas.style.opacity = '1'
  before.style.transition = 'opacity 0.3s'
  before.style.opacity = '0'

  function draw(now) {
    const elapsed   = now - startMs
    const progress  = Math.min(elapsed / ACCEL_MS, 1)
    // Ease-in: slow start, rapidly accelerating
    const eased     = progress * progress * progress

    ctx.fillStyle = `rgba(5, 8, 16, ${progress < 0.3 ? 0.55 : 0.8})`
    ctx.fillRect(0, 0, W, H)

    if (elapsed < ACCEL_MS) {
      stars.forEach(s => {
        const velocity   = s.speed * eased * 28         // px per frame at full speed
        const stretchLen = s.speed * eased * 60 + 1
        const x1 = cx + Math.cos(s.angle) * s.r
        const y1 = cy + Math.sin(s.angle) * s.r
        const x2 = cx + Math.cos(s.angle) * (s.r + stretchLen)
        const y2 = cy + Math.sin(s.angle) * (s.r + stretchLen)
        s.r += velocity

        const alpha = Math.min(s.opacity * eased * 3, s.opacity)
        if (s.hue === 'cyan')        ctx.strokeStyle = `rgba(34,212,224,${alpha})`
        else if (s.hue === 'orange') ctx.strokeStyle = `rgba(255,100,40,${alpha})`
        else                         ctx.strokeStyle = `rgba(242,240,230,${alpha})`

        ctx.lineWidth = s.speed * 0.9
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke()

        // Reset stars that fly off screen
        const maxR = Math.max(W, H)
        if (s.r > maxR) {
          s.r = Math.random() * 12 + 2
          s.angle = Math.random() * Math.PI * 2
        }
      })

      // Central glow at peak
      if (progress > 0.5) {
        const glowAlpha = (progress - 0.5) * 2 * 0.35
        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 120)
        grad.addColorStop(0, `rgba(34,212,224,${glowAlpha})`)
        grad.addColorStop(1, 'rgba(34,212,224,0)')
        ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(cx, cy, 120, 0, Math.PI*2); ctx.fill()
      }

      rafId = requestAnimationFrame(draw)
    } else if (elapsed < TOTAL_MS) {
      // Pure black hold
      ctx.fillStyle = '#050810'
      ctx.fillRect(0, 0, W, H)
      rafId = requestAnimationFrame(draw)
    } else {
      // Done — reveal welcome
      ctx.fillStyle = '#050810'
      ctx.fillRect(0, 0, W, H)
      canvas.style.transition = 'opacity 0.6s ease'
      canvas.style.opacity = '0'
      after.style.opacity = '1'
      after.style.pointerEvents = 'auto'
      setTimeout(() => cancelAnimationFrame(rafId), 700)
    }
  }

  rafId = requestAnimationFrame(draw)
}
</script>
</body>
</html>
