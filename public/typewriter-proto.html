<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Typewriter Feed — Prototype v2</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Orbitron:wght@700;900&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #070912;
    color: #EDE8DE;
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .shell {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .hero-eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.35em;
    color: #E85A00;
    margin-bottom: 0.5rem;
  }

  .hero-title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(2rem, 10vw, 3.2rem);
    font-weight: 900;
    letter-spacing: 0.05em;
    color: #E85A00;
    text-shadow: 0 0 40px rgba(232,90,0,0.5);
    margin-bottom: 0.5rem;
  }

  .hero-sub {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: #8A9AB5;
    margin-bottom: 2rem;
    text-align: center;
  }

  /* ── COMMS FEED box ── */
  .feed-box {
    width: 100%;
    background: rgba(7, 9, 18, 0.9);
    border: 1px solid #1E2840;
    border-top: 1px solid rgba(34,212,224,0.2);
    position: relative;
  }

  /* corner notch top-right */
  .feed-box::before {
    content: '';
    position: absolute;
    top: -1px; right: -1px;
    width: 18px; height: 18px;
    background: #070912;
    clip-path: polygon(0 0, 100% 0, 100% 100%);
    z-index: 2;
  }

  .feed-header {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.45rem 0.75rem;
    border-bottom: 1px solid #1A2238;
    position: sticky;
    top: 0;
    background: rgba(7,9,18,0.95);
    z-index: 1;
  }

  .feed-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #22D4E0;
    box-shadow: 0 0 6px rgba(34,212,224,0.7);
    animation: pulse 1.5s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.25} }

  .feed-label {
    font-size: 0.48rem;
    letter-spacing: 0.3em;
    color: #22D4E0;
  }

  .feed-date {
    margin-left: auto;
    font-size: 0.48rem;
    letter-spacing: 0.15em;
    color: #2A3550;
  }

  /* ── Scrollable lines area ── */
  .feed-lines {
    padding: 0.7rem 0.75rem 0.8rem;
    max-height: min(230px, 40vh);
    overflow-y: auto;
    scroll-behavior: smooth;
    scrollbar-width: thin;
    scrollbar-color: #1E2840 transparent;
  }
  .feed-lines::-webkit-scrollbar { width: 3px; }
  .feed-lines::-webkit-scrollbar-track { background: transparent; }
  .feed-lines::-webkit-scrollbar-thumb { background: #1E2840; border-radius: 2px; }

  /* scanline overlay — use a wrapper div in HTML instead of ::before on scrollable */

  .feed-line {
    display: block;
    font-size: 0.67rem;
    line-height: 1.75;
    color: #8A9AB5;
    margin-bottom: 0.55rem;
  }
  .feed-line:last-child { margin-bottom: 0; }

  .ts {
    display: inline;
    color: #253048;
    font-size: 0.55rem;
    letter-spacing: 0.05em;
    margin-right: 0.45rem;
  }

  /* line-text is just inline — text wraps naturally */
  .line-text {
    display: inline;
    line-height: 1.75;
  }

  /* colored highlight for key names */
  .hi-device  { color: #C07040; }
  .hi-voyager { color: #4ABCC8; }
  .hi-status-active   { color: #20D890; }
  .hi-status-inuse    { color: #E85A00; }

  /* inline circular avatar — inline-block so it flows with text */
  .inline-avatar {
    display: inline-block;
    width: 20px; height: 20px;
    border-radius: 50%;
    overflow: hidden;
    opacity: 0;
    transform: scale(0.4);
    transition: opacity 0.3s ease, transform 0.3s ease;
    vertical-align: middle;
    position: relative;
    top: -1px;
    margin: 0 2px;
  }
  .inline-avatar.device-av { border: 1px solid rgba(232,90,0,0.45); }
  .inline-avatar.voyager-av { border: 1px solid rgba(34,212,224,0.45); }
  .inline-avatar.show { opacity: 1; transform: scale(1); }
  .inline-avatar img { width:100%; height:100%; object-fit:cover; display:block; }
  .inline-avatar svg { width:100%; height:100%; display:block; }

  /* blinking cursor */
  .cursor {
    display: inline-block;
    width: 6px; height: 0.8em;
    background: #22D4E0;
    animation: blink 0.75s step-end infinite;
    vertical-align: middle;
    margin-left: 1px;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* bottom fade hint that more content is above (shows when scrollable) */
  .feed-scroll-hint {
    display: none;
    text-align: center;
    padding: 0.3rem;
    font-size: 0.48rem;
    letter-spacing: 0.2em;
    color: #2A3550;
    border-top: 1px solid #1A2238;
  }
  .feed-scroll-hint.visible { display: block; }

  /* ── CTA ── */
  .cta-mock {
    margin-top: 2rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    border: 1px solid rgba(232,90,0,0.5);
    padding: 0.75rem 1.5rem;
    color: #E85A00;
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.25em;
  }

  .note {
    margin-top: 3rem;
    font-size: 0.55rem;
    letter-spacing: 0.12em;
    color: #1E2840;
    text-align: center;
    line-height: 1.8;
  }
</style>
</head>
<body>

<div class="shell">
  <div class="hero-eyebrow">WELCOME,</div>
  <div class="hero-title">VOYAGER</div>
  <div class="hero-sub">YOU HAVE BEEN SELECTED TO EXPLORE<br>THE MYSTERIES OF PARALLEL WORLDS.</div>

  <div class="feed-box">
    <div class="feed-header">
      <div class="feed-dot"></div>
      <div class="feed-label">UPLINK // COLLECTIVE STATUS</div>
      <div class="feed-date" id="feedDate"></div>
    </div>
    <div class="feed-lines" id="feedLines"></div>
    <div class="feed-scroll-hint" id="scrollHint">↑ SCROLL FOR EARLIER ENTRIES</div>
  </div>

  <div class="cta-mock"><span>✦</span> BECOME A VOYAGER</div>
</div>

<div class="note">
  // PROTOTYPE v2 — no tags, type-once-stay, scroll overflow //<br>
  // in production: content generated daily by Claude from DB //
</div>

<script>
// ── Simulated daily-digest lines (in production: fetched from dashboard_feed table)
// Each segment: string | { kind:'avatar', avClass, initials, color } | { kind:'hi', hiClass, text }
const FEED_LINES = [
  {
    ts: '05.15',
    segments: [
      'Architect Council approved 3 new device nodes across Shanghai, Taipei, and Seoul.'
    ]
  },
  {
    ts: '05.12',
    segments: [
      { kind:'hi', hiClass:'hi-device', text:'Unit 001 — The Originator' },
      { kind:'avatar', avClass:'device-av', initials:'U1', color:'#E85A00' },
      ' confirmed ',
      { kind:'hi', hiClass:'hi-status-inuse', text:'IN USE' },
      ' — currently operated by Voyager Luke in Berlin.'
    ]
  },
  {
    ts: '05.10',
    segments: [
      'New Voyager ',
      { kind:'hi', hiClass:'hi-voyager', text:'Page' },
      { kind:'avatar', avClass:'voyager-av', initials:'VP', color:'#22D4E0' },
      ' joined the Collective via referral from Berlin chapter.'
    ]
  },
  {
    ts: '05.08',
    segments: [
      'Member Briefing issued. Welcome all new applicants — the Collective was established in 2023 with a mission of systematic observation.'
    ]
  },
  {
    ts: '05.03',
    segments: [
      { kind:'hi', hiClass:'hi-device', text:'Unit 019 — The Wanderer' },
      { kind:'avatar', avClass:'device-av', initials:'U3', color:'#20D890' },
      ' status updated to ',
      { kind:'hi', hiClass:'hi-status-active', text:'AVAILABLE' },
      ' — now stationed in Tokyo, Japan.'
    ]
  },
  {
    ts: '04.28',
    segments: [
      'Q3 Council Meeting Notes published. Three new known device nodes approved. Cross-temporal link protocols under review.'
    ]
  },
]

// ── Config
const CHAR_DELAY   = 28   // ms per character
const LINE_PAUSE   = 700  // ms pause between lines
const AVATAR_PAUSE = 280  // ms before avatar pops in

const container  = document.getElementById('feedLines')
const scrollHint = document.getElementById('scrollHint')
document.getElementById('feedDate').textContent = new Date().toISOString().slice(0,10).replace(/-/g,'.')

function sleep(ms) { return new Promise(r => setTimeout(r, ms)) }

function svgAvatar(initials, color) {
  return `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
    <rect width="40" height="40" fill="#0A0D1A"/>
    <circle cx="20" cy="20" r="13" fill="none" stroke="${color}" stroke-width="1.5" opacity="0.55"/>
    <text x="20" y="25" text-anchor="middle" font-family="monospace" font-size="12"
      font-weight="bold" fill="${color}">${initials}</text>
  </svg>`
}

function checkScrollHint() {
  const isScrollable = container.scrollHeight > container.clientHeight
  scrollHint.classList.toggle('visible', isScrollable)
}

async function runFeed() {
  const cursor = document.createElement('span')
  cursor.className = 'cursor'

  for (let i = 0; i < FEED_LINES.length; i++) {
    const entry = FEED_LINES[i]

    // Build the row
    const row = document.createElement('div')
    row.className = 'feed-line'

    const tsEl = document.createElement('span')
    tsEl.className = 'ts'
    tsEl.textContent = entry.ts
    row.appendChild(tsEl)

    const textSpan = document.createElement('span')
    textSpan.className = 'line-text'
    row.appendChild(textSpan)

    container.appendChild(row)

    // Scroll to keep current line visible
    container.scrollTop = container.scrollHeight

    // Type each segment
    for (const seg of entry.segments) {
      if (typeof seg === 'string') {
        // character by character
        for (const ch of seg) {
          if (cursor.parentNode) cursor.remove()
          textSpan.appendChild(document.createTextNode(ch))
          textSpan.appendChild(cursor)
          await sleep(CHAR_DELAY + (Math.random() * 14 - 7))
          container.scrollTop = container.scrollHeight
        }
      } else if (seg.kind === 'hi') {
        // highlighted text — type char by char in a colored span
        const span = document.createElement('span')
        span.className = seg.hiClass
        if (cursor.parentNode) cursor.remove()
        textSpan.appendChild(span)
        textSpan.appendChild(cursor)
        for (const ch of seg.text) {
          span.textContent += ch
          await sleep(CHAR_DELAY)
          container.scrollTop = container.scrollHeight
        }
      } else if (seg.kind === 'avatar') {
        // pause then pop in
        if (cursor.parentNode) cursor.remove()
        await sleep(AVATAR_PAUSE)
        const av = document.createElement('span')
        av.className = `inline-avatar ${seg.avClass}`
        av.innerHTML = svgAvatar(seg.initials, seg.color)
        textSpan.appendChild(av)
        textSpan.appendChild(cursor)
        await sleep(40)
        av.classList.add('show')
        await sleep(180)
        container.scrollTop = container.scrollHeight
      }
    }

    // After line done — check scroll hint visibility
    checkScrollHint()

    // Pause before next line (not after last)
    if (i < FEED_LINES.length - 1) {
      if (cursor.parentNode) cursor.remove()
      await sleep(LINE_PAUSE)
    }
    // Last line: leave cursor blinking at end
  }
}

runFeed()
</script>
</body>
</html>
