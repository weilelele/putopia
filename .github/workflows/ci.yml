name: CI

# Verification gate for pull requests (and pushes to main).
# Typecheck + build are hard gates; lint is advisory until the existing
# lint backlog is cleared, then it can be promoted to a hard gate too.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · build
    runs-on: ubuntu-latest
    # Placeholder build-time env. These are NOT secrets — Next.js only needs
    # the variables to be present to compile; no real services are contacted
    # during `next build`. Real values live in the hosting provider.
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
      NEXT_PUBLIC_SITE_URL: https://example.com
      NEXT_PUBLIC_POSTHOG_KEY: phc_placeholder
      NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_PRICE_ID: price_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      ANTHROPIC_API_KEY: sk-ant-placeholder
      CRON_SECRET: placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
